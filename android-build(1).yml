name: Build FM-DX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Localizar e extrair o projeto ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 3 -type f -name '*Receptor-Nativo-Servidor*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Nao encontrei o ZIP do projeto no repositorio."
            exit 1
          fi
          echo "Usando: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de depuracao
        shell: bash
        run: |
          ANDROID_DIR="$(find source -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$ANDROID_DIR" ]; then
            echo "Nao encontrei android/settings.gradle dentro do ZIP."
            exit 1
          fi
          cd "$ANDROID_DIR"
          gradle --no-daemon assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: FM-DX-Android-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
